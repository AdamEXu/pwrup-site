name = "pwrup-site"
# Build-time Node is pinned via package.json engines and .nvmrc (>=22.12).
# Do not set a top-level account_id: Workers Builds authenticates as the
# Git-connected Cloudflare account (Adam), while pinewoodrobotics.org
# production lives on the Pinewood Robotics account.
compatibility_date = "2024-12-20"

# Static site configuration - serve everything from dist/ as static assets
[assets]
directory = "./dist"

# Production custom domains. Deploy with:
#   CLOUDFLARE_ACCOUNT_ID=007109207807e3fa4cf11bf6090879da wrangler deploy --env production
[env.production]
name = "pwrup-site"
account_id = "007109207807e3fa4cf11bf6090879da"
routes = [
  { pattern = "pinewoodrobotics.org", zone_name = "pinewoodrobotics.org" },
  { pattern = "www.pinewoodrobotics.org", zone_name = "pinewoodrobotics.org" }
]
